[project]
name = "msclear"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "gymnasium==1.3.0", "ale-py==0.12.0", "numpy", "pytest"]

[project.optional-dependencies]
video = ["pillow", "imageio", "imageio-ffmpeg"]
report = ["matplotlib", "tensorboard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
